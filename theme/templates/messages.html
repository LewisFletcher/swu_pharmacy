{% if messages %}
<div class="fixed top-20 right-4 z-50 space-y-2 max-w-sm w-full">
    {% for message in messages %}
    <div x-data="{ shown: true }"
         x-show="shown"
         x-init="setTimeout(() => shown = false, 5000)"
         x-transition
         role="alert"
         class="alert shadow-sm
         {% if message.tags == 'error' %}alert-error
         {% elif message.tags == 'success' %}alert-success
         {% elif message.tags == 'warning' %}alert-warning
         {% elif message.tags == 'info' %}alert-info
         {% endif %}">
        <span class="text-sm">{{ message }}</span>
        <button @click="shown = false" type="button" class="btn btn-ghost btn-xs" aria-label="Dismiss">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
