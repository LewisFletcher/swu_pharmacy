{% extends "index.html" %}
{% block content %}
<div class="flex justify-center px-4 py-16">
    <div class="card w-full max-w-lg bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body items-center text-center">
            <svg class="w-12 h-12 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h1 class="text-2xl font-semibold mt-2">Server Error</h1>
            <p class="text-base-content/60">Something went wrong on our end. Please try again in a moment.</p>
            <div class="flex gap-3 mt-4">
                <a href="/" class="btn btn-primary">Return Home</a>
                <button onclick="history.back()" class="btn btn-outline">Go Back</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
