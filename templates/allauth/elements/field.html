{% load allauth %}
{% if attrs.errors %}<p class="text-error text-sm mb-1">{{ attrs.errors }}</p>{% endif %}
<div class="form-control w-full mb-3">
    {% if attrs.type == "textarea" %}
        <label for="{{ attrs.id }}" class="label"><span class="label-text">{% slot label %}{% endslot %}</span></label>
        <textarea class="textarea w-full"
                  {% if attrs.required %}required{% endif %}
                  {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
                  {% if attrs.disabled %}disabled{% endif %}
                  {% if attrs.readonly %}readonly{% endif %}
                  {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                  {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                  {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
    {% elif attrs.type == "checkbox" or attrs.type == "radio" %}
        <label for="{{ attrs.id }}" class="label cursor-pointer justify-start gap-3">
            <input class="{% if attrs.type == 'checkbox' %}checkbox{% else %}radio{% endif %}"
                   {% if attrs.required %}required{% endif %}
                   {% if attrs.disabled %}disabled{% endif %}
                   {% if attrs.readonly %}readonly{% endif %}
                   {% if attrs.checked %}checked{% endif %}
                   {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
                   {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
                   {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
                   type="{{ attrs.type }}">
            <span class="label-text">{% slot label %}{% endslot %}</span>
        </label>
    {% else %}
        <label for="{{ attrs.id }}" class="label"><span class="label-text">{% slot label %}{% endslot %}</span></label>
        <input class="input w-full"
               {% if attrs.required %}required{% endif %}
               {% if attrs.disabled %}disabled{% endif %}
               {% if attrs.readonly %}readonly{% endif %}
               {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
               {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
               {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
               {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
               {% if attrs.value is not None %}value="{{ attrs.value }}"{% endif %}
               type="{{ attrs.type }}">
    {% endif %}
    {% if slots.help_text %}
        <span class="label"><span class="label-text-alt text-base-content/60">{% slot help_text %}{% endslot %}</span></span>
    {% endif %}
</div>
