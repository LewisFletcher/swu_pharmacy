{% extends "index.html" %}
{% load django_tables2 %}

{% block title %}{{ title }} - Swinging Udder Veterinary Services{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold text-base-content">{{ title }}</h1>
        <a href="{% url add_url %}" class="btn btn-primary">+ New</a>
    </div>

    <div class="card bg-base-100 border border-base-300 shadow-sm mb-6">
        <div class="card-body p-4">
            <form method="get" class="flex flex-wrap items-end gap-3">
                {% for field in filter.form %}
                <div class="form-control">
                    <label class="label py-1" for="{{ field.id_for_label }}"><span class="label-text text-xs">{{ field.label }}</span></label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-outline">Filter</button>
                <a href="{% url "pharmacy:prescription-list" %}" class="btn btn-ghost">Reset</a>
            </form>
        </div>
    </div>

    {% render_table table %}
</div>
{% endblock %}
